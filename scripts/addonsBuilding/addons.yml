# =============================================================================
#  addons.yml — конфигурация аддонов (дополнений) для сборки RRS
#
#  Назначение: перечень внешних репозиториев (GitHub, Codeberg), которые
#  загружаются в проект и подключаются к сборке как аддоны (см.
#  addons/CMakeLists.txt в корне проекта, который добавляет addons/passcar,
#  addons/freightcar, addons/vl60 и внешние аддоны из этой конфигурации).
#
#  Источник перечня — раздел «Add-ons» в README проекта: имена, ссылки и
#  описания аддонов приведены в соответствие с ним.
#
#  Загрузчик: цель addons в scripts/Makefile.linux; обёртки build_linux.sh и
#  scripts/addonsBuilding/build_addons.sh только передают ей аргументы.
#
#  Формат: YAML 1.2. Кодировка: UTF-8. Комментарии — на русском.
#
#  Все относительные пути указываются от корня проекта.
#
#  Структура файла:
#    version   — версия схемы конфигурации;
#    defaults  — значения по умолчанию для всех аддонов;
#    addons    — список аддонов с переопределением параметров.
# =============================================================================

# Версия схемы конфигурации (используется обработчиком для проверки совместимости).
version: 1

# -----------------------------------------------------------------------------
#  Значения по умолчанию: применяются ко всем аддонам, если не переопределены
#  в их собственном разделе.
# -----------------------------------------------------------------------------
defaults:

  # Каталог, в который устанавливаются аддоны (относительно корня проекта).
  # Итоговый путь аддона: <destination_root>/<name>, например external_addons/tep70.
  # При необходимости путь можно переопределить в самом аддоне полем destination.
  destination_root: external_addons

  # Служебный каталог клонирования: аддон сначала полностью загружается сюда,
  # затем каталог переносится в destination, поэтому прерванная загрузка не
  # оставляет полуфабрикат в external_addons/<имя>. В сборку и в дистрибутив не входит.
  cache_root: external_addons/.cache

  # Параметры загрузки репозиториев.
  clone:
    # Способ подключения к GitHub: https | ssh.
    protocol: https
    # Глубина клона: 1 — только последний коммит (shallow), 0 — полная история.
    depth: 1
    # Загружать подмодули репозитория.
    recurse_submodules: false
    # Таймаут одной операции загрузки, с. Аддоны большие (сотни мегабайт),
    # поэтому по умолчанию задан запас на медленное соединение.
    timeout_sec: 3600
    # Число повторов при сетевой ошибке. Повтор начинается с чистой уборки
    # служебного каталога, поэтому обрыв загрузки не ломает следующую попытку.
    retries: 3

  # Параметры подключения аддона к сборке.
  build:
    # Добавлять аддон в addons/CMakeLists.txt (add_subdirectory).
    add_to_cmake: true
    # Собирать аддон в составе проекта.
    enabled: true
    # Учитывать аддон при установке дистрибутива (cmake --install).
    install: true

# -----------------------------------------------------------------------------
#  Список аддонов.
#
#  Обязательные поля: name, url.
#  Остальные поля переопределяют значения из defaults.
# -----------------------------------------------------------------------------
addons:

  # --- ТЭП70 -----------------------------------------------------------------
  - name: tep70                                    # имя аддона и каталога
    description: Пассажирский магистральный тепловоз ТЭП70
    url: https://github.com/maisvendoo/tep70.git
    branch: devel                                  # ветка по умолчанию: devel
    #  Запасные ветки: если аддон не собирается из основной ветки, загрузчик
    #  пробует их по порядку. devel-for-1.10.0 — ветка под RRS 1.10.
    branches:
      - devel
      - devel-for-1.10.0
    commit: ""                                     # пусто — последний коммит ветки; иначе фиксация (sha)
    subdirectory: ""                               # "" — весь репозиторий; иначе путь внутри репозитория
    license: GPL-2.0
    homepage: https://github.com/maisvendoo/tep70
    clone:
      depth: 1
    build:
      add_to_cmake: true
      enabled: true
      install: true

  # --- ЭП1М ------------------------------------------------------------------
  - name: ep1m                                     # в репозитории дополнительно есть msud-display
    description: Пассажирский магистральный электровоз переменного тока ЭП1М
    url: https://github.com/maisvendoo/ep1m.git
    branch: devel                                  # ветка по умолчанию: devel
    commit: ""                                     # пусто — последний коммит ветки; иначе фиксация (sha)
    subdirectory: ""                               # "" — весь репозиторий; иначе путь внутри репозитория
    license: GPL-2.0
    homepage: https://github.com/maisvendoo/ep1m
    clone:
      depth: 1
    build:
      add_to_cmake: true
      enabled: true
      install: true

  # --- ЧС2т ------------------------------------------------------------------
  #  Ссылка из таблицы аддонов README ведёт на codeberg.org/RRS-dev/chs2t,
  #  но этот репозиторий без авторизации отдаёт 404, поэтому используется
  #  рабочее зеркало на GitHub.
  - name: chs2t
    description: Пассажирский магистральный электровоз постоянного тока ЧС2т
    url: https://github.com/maisvendoo/chs2t.git
    branch: ""                                     # пусто — ветка по умолчанию
    commit: ""                                     # пусто — последний коммит ветки; иначе фиксация (sha)
    subdirectory: ""                               # "" — весь репозиторий; иначе путь внутри репозитория
    license: GPL-2.0
    homepage: https://github.com/maisvendoo/chs2t
    clone:
      depth: 1
    build:
      add_to_cmake: true
      enabled: true
      install: true

  # --- ТЭМ15 -----------------------------------------------------------------
  #  Ветка по умолчанию — master (ветки devel в репозитории нет).
  - name: tem15
    description: Маневровый тепловоз с гидропередачей ТЭМ15
    url: https://codeberg.org/RRS-dev/tem15.git
    branch: master                                 # основная ветка репозитория: master
    commit: ""                                     # пусто — последний коммит ветки; иначе фиксация (sha)
    subdirectory: ""                               # "" — весь репозиторий; иначе путь внутри репозитория
    license: GPL-2.0
    homepage: https://codeberg.org/RRS-dev/tem15
    clone:
      depth: 1
    build:
      add_to_cmake: true
      enabled: true
      install: true

  # --- РА3 -------------------------------------------------------------------
  - name: ra3
    description: Дизель-поезд (рельсовый автобус) РА3 для пригородных перевозок
    url: https://codeberg.org/RRS-dev/ra3.git
    branch: devel                                  # ветка по умолчанию: devel
    commit: ""                                     # пусто — последний коммит ветки; иначе фиксация (sha)
    subdirectory: ""                               # "" — весь репозиторий; иначе путь внутри репозитория
    license: GPL-2.0
    homepage: https://codeberg.org/RRS-dev/ra3
    clone:
      depth: 1
    build:
      add_to_cmake: true
      enabled: true
      install: true

  # --- Пакет цистерн -------------------------------------------------------
  - name: cisterns_pack
    description: Пакет вагонов-цистерн для перевозки наливных грузов
    url: https://codeberg.org/RRS-dev/cisterns_pack.git
    branch: devel                                  # ветка по умолчанию: devel
    commit: ""                                     # пусто — последний коммит ветки; иначе фиксация (sha)
    subdirectory: ""                               # "" — весь репозиторий; иначе путь внутри репозитория
    license: GPL-2.0
    homepage: https://codeberg.org/RRS-dev/cisterns_pack
    clone:
      depth: 1
    build:
      add_to_cmake: true
      enabled: true
      install: true